# 麦麦祝你生日快乐呀（geffnt.maibot-birthday-plugin）
#
# 布局参考 Color2333/maibot-multi-platform-parser：[plugin] 头 + 按功能分组的扁平键。
# 每个键都对应 core/config.py 的 Schema 字段；类型写错会让这份配置校验失败，
# 日志里会有报错，插件会沿用上一份可用配置。
# 保存后 Host 会重新校验并推给插件，生效时日志出现「麦麦祝你生日快乐呀配置已更新」。
#
# 快速上手：
#   1. [source] 打开 include_friends，发 /birth recheck 采一次；
#   2. [greeting] 的 announce_groups 留空 = 一个群都不碰，用 /birth group <群号> 加；
#   3. 两个道贺开关（greet_in_group / greet_in_private）可以只开一个。
# 模板文件：全部为 Schema 默认值。复制成 config.toml 再按需修改。
# ==================== 插件设置 ====================
[plugin]
# 插件名称
name = "maibot_birthday_plugin"
# 配置 schema 版本（与插件版本独立，仅在配置字段结构变更时手动上调）
config_version = "1.0.0"
# 是否启用插件
enabled = true
# 提供 adapter.napcat.* API 的适配器插件 ID。读取生日依赖 NapCat 特有的
# birthday_year/month/day 字段，SnowLuma 适配器没有这些字段；两个兼容适配器同时启用时短名
# 不唯一、Host 会拒绝调用，因此默认填 NapCat 适配器的全名。留空则按短名调用，由 Host 自动
# 定位唯一提供方
adapter_plugin_id = "maibot-team.napcat-adapter"
# ==================== 生日采集 ====================
[source]
# 是否采集好友列表的生日。走 get_friend_list 一次拿全量，NapCat 的返回里直接带
# birthday_year/month/day，成本最低
include_friends = true
# [谨慎] 是否采集群成员生日。「群聊道贺」要靠它才知道群里有谁、他们的生日是几号。群成员列
# 表本身不含生日，需要逐个调用 get_stranger_info，人数多时请求量大、有触发风控的风险，所以
# 带每群上限和总量预算。注意只采 greeting.announce_groups 白名单里的群，白名单留空时一个群
# 都不采
include_group_members = false
# 每个群单次最多为多少人查名片（防止在大群里一次刷几千个请求）；0 表示不限制
max_members_per_group = 100
# 单次采集里跨群合计最多查多少次名片，这是防风控的总闸；0 表示不限制。首次采集最坏情况 =
# 这个数字 × 查名片间隔
max_stranger_queries = 300
# 逐个查名片之间的间隔（毫秒），用来错开请求避免风控
stranger_fetch_delay_ms = 800
# 自动重新采集的间隔（小时），默认 168 小时（7 天）。生日数据变动很慢，没必要频繁拉取
refresh_interval_hours = 168
# 插件启动后延迟多少秒做首次采集，给适配器和连接留出就绪时间
initial_refresh_delay_seconds = 30
# 查询时是否禁用 NapCat 缓存（no_cache=True 会强制走 QQ 服务器）。默认 False 走本地缓存，
# 更快、请求更轻；想让刚改过名片的生日立刻生效时再开
no_cache = false
# 采集成功时，是否把本次没出现的人从缓存里删掉。默认关闭：一次不完整的采集（比如适配器半途
# 断开）不应该清空已有数据
drop_missing = false
# ==================== 生日道贺 ====================
[greeting]
# 群聊道贺开关：开启后在寿星所在的群里 @ 他并祝贺。寿星范围来自群成员采集
# （source.include_group_members），群范围由下面的白名单决定。与私聊开关互相独立，可以只开一
# 个
greet_in_group = false
# 私聊道贺开关：开启后给过生日的好友单独发一条私聊。只对好友生效——非好友开不了私聊流。与群
# 聊开关互相独立
greet_in_private = false
# 非好友私聊：好友走正常私聊，非好友改用「群临时会话」发（send_private_msg 带 group_id）。
# 能否发出去取决于那个群是否允许成员发起临时会话（QQ 群设置里能关）；发送失败只记日志，群
# 道贺不受影响
private_temp_session = true
# 群白名单：既是采集群成员的范围，也是群道贺的范围。留空 = 一个群都不碰（不采集、不群发）—
# —空列表就照字面读作「没选群」。要把「机器人所在的全部群」都算进来，请显式写 ["*"]，这样
# 「扫全部群」永远是一个看得见的决定，而不是空字段的副作用
announce_groups = []
# 群道贺时是否 @ 寿星本人；关掉就发普通文本
at_person = true
# 允许道贺的起始小时（本地时间，24 小时制）。早于这个时间不发，避免凌晨吵人
hour_start = 8
# 允许道贺的结束小时（本地时间，开区间）。到点后当天不再补发，避免深夜打扰
hour_end = 23
# 道贺文案模板。可用占位符：{name}=昵称/备注、{age}=岁数（无名片年份时为空）、{month}、
# {day}=月日、{qq}=QQ号。开启「文案由模型生成」时，它退化为兜底文案（模型调用失败时发送）
# 与风格参考
greeting_template = "🎂 生日快乐，{name}！祝你新的一岁顺顺利利，想做的事都能成～"
# 文案是否交给模型生成。默认开启：把生日信息注入生成提示后，由 llm_task_name 指定的任务输
# 出文案（相当于把「说什么」也交给麦麦的模型）。调用失败或输出为空时自动回退到
# greeting_template，绝不会因此漏发道贺
use_llm_polish = true
# 生成文案用的模型任务槽位（Host model_task_config 下的任务名）。replyer=麦麦的主回复模型
# （默认，语气更贴人设）；utils=通用快模型（更省更快，风格偏中性）；planner=规划模型
llm_task_name = "replyer"
# 生成文案的最大 token 数，默认 10000（与 replyer 任务的默认值一致）；0 = 不覆盖、跟随
# Host 模型配置（replyer 也是 10000）。别调小：回复类模型会先输出一段思考再给正文，额度太
# 小会返回空内容（实测 128 必踩），此时会回退兜底文案；日志里的「达到最大输出 token 限制」
# +「文案生成返回空内容」就是这个原因。插件只取第一行、并截断到 120 字，所以额度给足不会让
# 发出去的文案变长
llm_max_tokens = 10000
# 文案生成采样温度（replyer 任务默认就是 1.0）
llm_temperature = 1.0
# ==================== 上下文注入 ====================
[prompt]
# 是否在麦麦生成回复前，把「今天是谁的生日」追加到本次回复要求里。只影响提示词、不做任何
# IO；注意 Hook 只在麦麦本来就要回复时触发
inject_prompt = true
# 已经主动道贺过的人，当天不再注入。默认开启——避免「插件先主动发了一条祝福，麦麦聊天时又被
# 提醒再提一次」的重复。注意只有真正送达才会被记为已道贺：主动发送失败时注入照常发生，相当
# 于兜底。道贺方式为 off/prompt_only 时无人被标记，此项无效果
skip_greeted = true
# 一次最多列几个寿星名字。同一天过生日的人多时，只列前几个，避免提示词失控
max_names = 5
# 提前几天开始提醒（0=只在当天提醒）。例如填 1，生日前一天也会注入「X 明天生日」，方便麦麦
# 提前准备
include_upcoming_days = 0
# 注入到回复要求里的文本模板，「文案怎么说」同样交给麦麦的回复模型。可用占位符：{names}=寿
# 星列表（含昵称，可能多个）、{count}=人数、{upcoming}=未来几天即将过生日的人（可能为空）。
# 想回到更保守的「合适才提」语气，把默认文本换成：【生日提醒】今天是 {names} 的生日。如
# 果当前对话里自然合适，可以顺口祝一句生日快乐；如果不合适或在聊别的事，就正常聊，不要硬提。
prompt_template = "【生日提醒】今天是 {names} 的生日。请在你这次回复里用自己的话顺带送上一句生日祝福，语气自然、别太正式，一句就够，不用单独再发一条；如果你这轮本来不适合说话，就不用勉强。"
# ==================== 指令权限 ====================
[access]
# 允许执行写操作指令（recheck / group / custom / del）的 QQ 号。本机操作者
# （is_local_operator）始终允许。留空表示只有本机操作者能改数据
admin_user_ids = []